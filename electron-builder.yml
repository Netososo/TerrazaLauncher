appId: 'com.terraza.launcher'
productName: 'Terraza Launcher'
artifactName: 'Terraza-Launcher-Setup-${version}.${ext}'

copyright: 'Copyright © 2026 Terraza Studios'

asar: true
compression: 'maximum'

publish:
  provider: 'github'
  owner: 'Netososo'
  repo: 'TerrazaLauncher'
  releaseType: 'release'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,.eslintrc.json}'

extraResources:
  - 'libraries'

win:
  target:
    - target: 'nsis'
      arch: 'x64'

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Terraza-Launcher-Setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

linux:
  target: 'AppImage'
  maintainer: 'Terraza Studios'
  vendor: 'Terraza Studios'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'

directories:
  buildResources: 'build'
  output: 'dist'
